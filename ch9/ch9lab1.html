<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trip Inquiry</title>
  <link rel="stylesheet" href="ch9lab.css">
</head>
<body>
  <h1>Plan Your Trip</h1>
  <form id="inquiry" action="#" method="post">
    <p>
      <label for="fullname">Full Name:</label>
      <input type="text" id="fullname" name="fullname" accesskey="n" tabindex="1" required>
    </p>
    <p>
      <label for="email">E-mail:</label>
      <input type="email" id="email" name="email" tabindex="2" required>
    </p>
    <p>
      <label for="destination">Destination:</label>
      <select id="destination" name="destination" tabindex="3">
        <optgroup label="Europe">
          <option value="rome">Rome</option>
          <option value="paris" selected>Paris</option>
          <option value="barcelona">Barcelona</option>
        </optgroup>
        <optgroup label="Asia">
          <option value="tokyo">Tokyo</option>
          <option value="bali">Bali</option>
          <option value="bangkok">Bangkok</option>
        </optgroup>
      </select>
    </p>
    <fieldset>
      <legend>Travel style</legend>
      <input type="radio" id="budget" name="style" value="budget" checked>
      <label for="budget">Budget</label>
      <input type="radio" id="comfort" name="style" value="comfort">
      <label for="comfort">Comfort</label>
      <input type="radio" id="luxury" name="style" value="luxury">
      <label for="luxury">Luxury</label>
    </fieldset>
    <fieldset>
      <legend>Extras</legend>
      <input type="checkbox" id="pickup" name="extras" value="pickup">
      <label for="pickup">Airport pickup</label>
      <input type="checkbox" id="insurance" name="extras" value="insurance">
      <label for="insurance">Travel insurance</label>
      <input type="checkbox" id="guide" name="extras" value="guide">
      <label for="guide">Local tour guide</label>
    </fieldset>
    <p>
      <label for="comments">Questions or comments:</label>
      <textarea id="comments" name="comments" rows="5" cols="40" tabindex="4"></textarea>
    </p>
    <p class="buttons">
      <input type="image" src="images/send-button.png" alt="Send your inquiry">
    </p>
  </form>
</body>
</html>
